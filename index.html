<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive English grammar assessment focused on Past Simple, Past Participle and Present Perfect."><title>Grammar & Comprehension | 40-question English Assessment</title>
<style>
:root{--ink:#20231f;--muted:#6c7169;--paper:#f5f6f2;--card:#fff;--line:#e1e5dc;--accent:#c8f169;--dark:#22271f;--focus:#476b16}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--dark);color:white;padding:34px 20px 30px}.hero,main{max-width:900px;margin:auto}.kicker{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{font-size:clamp(28px,5vw,43px);line-height:1.08;letter-spacing:-.04em;margin:12px 0}header p{color:#d0d4ca;margin:0;max-width:700px}main{padding:24px 16px 50px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.meta .card{margin:0}.field-label{display:block;font-weight:650;font-size:14px;margin:0 0 6px}input[type=text],input[type=date]{width:100%;border:1px solid #d8ddd3;background:#fcfcfa;border-radius:9px;padding:11px 12px;font:inherit;color:var(--ink)}.section-head{display:flex;align-items:center;gap:12px;margin:0 0 15px}.num{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:850}h2{font-size:18px;letter-spacing:-.02em;margin:0}.instruction{color:var(--muted);font-size:13px;margin:3px 0 18px}.reading{background:#f7f8f4;border-radius:10px;padding:17px;border-left:3px solid var(--accent);margin:10px 0 20px}.q{padding:16px 0;border-top:1px solid #edf0e8}.q:first-child{border-top:0}.q p{font-weight:650;margin:0 0 12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid #dfe4d9;border-radius:11px;padding:11px 12px;cursor:pointer;background:#fff;min-height:46px;transition:border-color .12s,background .12s}.option:hover{border-color:#9eac8e}.option:has(input:checked){border-color:#727d62;background:#f3f6ee}.option input{margin:4px 0 0;accent-color:#293321;flex:none;width:16px;height:16px}.option span{font-size:14px;overflow-wrap:anywhere}.option:focus-within{outline:3px solid #c8f169;outline-offset:2px}button{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#20231f}.secondary{background:#edf0e8;color:#30352d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary:focus-visible,.secondary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.progress{height:7px;background:#e4e8de;border-radius:99px;overflow:hidden;margin:0 0 18px}.progress-bar{height:100%;width:0;background:var(--accent);transition:width .15s}#status{display:none;margin-top:20px;padding:20px;border-radius:14px;background:#fff;border:1px solid var(--line)}#status h2{margin-bottom:8px}.score{font-size:clamp(23px,4vw,34px);font-weight:850;letter-spacing:-.03em}.result-item{border-top:1px solid var(--line);padding:15px 0}.result-item h3{font-size:15px;margin:0 0 8px}.result-item p{margin:5px 0;font-size:14px}.wrong{color:#333}.correct-answer{font-weight:700}.explanation{color:#5b6255}.notice{font-size:13px;color:var(--muted)}footer{font-size:12px;color:var(--muted);text-align:center;padding:22px 0 0}@media(max-width:620px){.meta,.options{grid-template-columns:1fr}.card{padding:17px}.option{min-height:44px}}@media print{body{background:white}.card{break-inside:avoid;border:1px solid #bbb}header{background:white;color:black;padding:15px 0}header p,.kicker{color:#333}.actions,.progress,.meta{display:none!important}.option{break-inside:avoid}#status{display:block!important}.q{break-inside:avoid}}
</style></head><body><header><div class="hero"><div class="kicker">English · Interactive assessment</div><h1>Grammar & Comprehension</h1><p>Past Simple · Past Participle · Present Perfect. Select one answer for every question. Results and explanations appear only after submission.</p></div></header><main><div class="meta"><div class="card"><label class="field-label" for="student">Student name (optional)</label><input id="student" type="text" autocomplete="name"></div><div class="card"><label class="field-label" for="date">Date (optional)</label><input id="date" type="date"></div></div><div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div><p class="notice" id="progressText" aria-live="polite">0 of 40 answered</p><div id="test"></div><div class="actions"><button class="primary" id="submitBtn" type="button">Finish test</button><button class="secondary" id="printBtn" type="button">Print / Save as PDF</button><button class="secondary" id="resetBtn" type="button">Restart test</button></div><section id="status" aria-live="polite" tabindex="-1"></section><footer>40-question assessment · No feedback is shown until you finish the test.</footer></main>
<script>
const QUESTIONS = [{"section":"01 · Past Simple or Present Perfect","prompt":"I ______ Daniel yesterday.","options":["haven't seen","didn't see","don't see","wasn't seen"],"correct":1,"explanation":"Con un momento pasado terminado como “yesterday”, se usa Past Simple; la negativa se forma con did not + infinitivo."},{"section":"01 · Past Simple or Present Perfect","prompt":"She ______ four emails so far today.","options":["wrote","has written","have written","writes"],"correct":1,"explanation":"“So far today” conecta una acción con un periodo que sigue abierto; se usa Present Perfect. Con “she”, corresponde has + participio."},{"section":"01 · Past Simple or Present Perfect","prompt":"______ you ever ______ Korean food?","options":["Did / ate","Have / eaten","Has / ate","Do / eat"],"correct":1,"explanation":"Para preguntar por experiencias vitales sin indicar cuándo, se usa Have + sujeto + past participle."},{"section":"01 · Past Simple or Present Perfect","prompt":"My brother ______ his phone last week.","options":["has broken","breaks","broke","has broke"],"correct":2,"explanation":"“Last week” es un periodo pasado terminado, por lo que se usa Past Simple: broke."},{"section":"01 · Past Simple or Present Perfect","prompt":"We ______ each other for six years.","options":["knew","have known","are knowing","has known"],"correct":1,"explanation":"“For six years” expresa una situación que continúa hasta ahora; se usa Present Perfect con “we”: have known."},{"section":"01 · Past Simple or Present Perfect","prompt":"He ______ his homework yet.","options":["didn't finish","hasn't finished","haven't finished","not finished"],"correct":1,"explanation":"“Yet” en una negativa suele acompañar al Present Perfect: has not + past participle."},{"section":"01 · Past Simple or Present Perfect","prompt":"They ______ London in 2023.","options":["have visited","visited","has visited","visit"],"correct":1,"explanation":"“In 2023” se refiere a un momento pasado terminado; se usa Past Simple."},{"section":"01 · Past Simple or Present Perfect","prompt":"I ______ my keys. I can't open the door.","options":["lost yesterday","have lost","have lose","did lost"],"correct":1,"explanation":"La pérdida tiene un resultado presente (no puede abrir la puerta); se usa Present Perfect: have lost."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Participle of “go”?","options":["gone","goed","going","have go"],"correct":0,"explanation":"El Past Participle de “go” es “gone”. Se utiliza, entre otros casos, con have/has para formar el Present Perfect."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Simple form of “see”?","options":["saw","seeed","seeing","have see"],"correct":0,"explanation":"El Past Simple de “see” es “saw”. Es una forma verbal que se usa para acciones terminadas en el pasado."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Participle of “take”?","options":["taken","takeed","takeing","have take"],"correct":0,"explanation":"El Past Participle de “take” es “taken”. Se utiliza, entre otros casos, con have/has para formar el Present Perfect."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Simple form of “speak”?","options":["spoke","speaked","speaking","have speak"],"correct":0,"explanation":"El Past Simple de “speak” es “spoke”. Es una forma verbal que se usa para acciones terminadas en el pasado."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Participle of “speak”?","options":["spoken","speaked","speaking","have speak"],"correct":0,"explanation":"El Past Participle de “speak” es “spoken”. Se utiliza, entre otros casos, con have/has para formar el Present Perfect."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Simple form of “choose”?","options":["chose","chooseed","chooseing","have choose"],"correct":0,"explanation":"El Past Simple de “choose” es “chose”. Es una forma verbal que se usa para acciones terminadas en el pasado."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Participle of “break”?","options":["broken","breaked","breaking","have break"],"correct":0,"explanation":"El Past Participle de “break” es “broken”. Se utiliza, entre otros casos, con have/has para formar el Present Perfect."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Simple form of “write”?","options":["wrote","writeed","writeing","have write"],"correct":0,"explanation":"El Past Simple de “write” es “wrote”. Es una forma verbal que se usa para acciones terminadas en el pasado."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Participle of “write”?","options":["written","writeed","writeing","have write"],"correct":0,"explanation":"El Past Participle de “write” es “written”. Se utiliza, entre otros casos, con have/has para formar el Present Perfect."},{"section":"02 · Infinitive, Past Simple and Past Participle","prompt":"What is the Past Simple form of “eat”?","options":["ate","eated","eating","have eat"],"correct":0,"explanation":"El Past Simple de “eat” es “ate”. Es una forma verbal que se usa para acciones terminadas en el pasado."},{"section":"03 · Reading: identify and use the tenses","prompt":"What kind of workplace did Maya join?","options":["A small publishing company","A hospital","A travel agency","A primary school"],"correct":0,"explanation":"El texto dice que Maya aceptó un puesto en una pequeña editorial (a small publishing company)."},{"section":"03 · Reading: identify and use the tenses","prompt":"How did her manager respond to her early mistakes?","options":["He encouraged her to learn from them","He immediately dismissed her","He ignored all her work","He moved her to another company"],"correct":0,"explanation":"El texto indica que su gerente la animó a aprender de los errores."},{"section":"03 · Reading: identify and use the tenses","prompt":"What new responsibility has Maya taken on?","options":["Managing a new project","Hiring every employee","Editing a newspaper","Teaching at a school"],"correct":0,"explanation":"El Present Perfect “has recently started managing” indica que recientemente ha empezado a gestionar un proyecto."},{"section":"03 · Reading: identify and use the tenses","prompt":"Which sentence from the passage uses the Present Perfect?","options":["She has recently started managing a new project.","Last Tuesday, the company announced the news.","During her first month, she made several mistakes.","Maya felt nervous at first."],"correct":0,"explanation":"“Has started” es Present Perfect: has + participio pasado (started)."},{"section":"04 · Complete the paragraph","prompt":"Last summer, my family ______ to Scotland for the first time.","options":["travelled","has travelled","have travel","travels"],"correct":0,"explanation":"“Last summer” es un periodo terminado: Past Simple, “travelled”."},{"section":"04 · Complete the paragraph","prompt":"We ______ the country before that trip.","options":["have never visited","had never visited","never visit","has never visited"],"correct":1,"explanation":"La visita ocurrió antes de otro momento pasado (the trip); el Past Perfect “had visited” expresa esa anterioridad."},{"section":"04 · Complete the paragraph","prompt":"The weather ______ suddenly, and we had to find shelter.","options":["has changed","change","changed","have changed"],"correct":2,"explanation":"La narración se desarrolla en un viaje pasado; “changed” mantiene el Past Simple."},{"section":"04 · Complete the paragraph","prompt":"Since that trip, I ______ interested in Scottish history.","options":["became","have become","has became","become"],"correct":1,"explanation":"“Since that trip” conecta el pasado con el presente; se usa Present Perfect, “have become”."},{"section":"04 · Complete the paragraph","prompt":"I ______ two books about it already, but I haven't visited Edinburgh yet.","options":["read","have already read","has already read","am read"],"correct":1,"explanation":"“Already” en este contexto acompaña al Present Perfect: have + participio “read” (pronunciado /red/)."},{"section":"05 · Transform the sentences","prompt":"I last saw Oliver in 2022. Choose the sentence using “since”.","options":["I haven't seen Oliver since 2022.","I didn't see Oliver since 2022.","I haven't saw Oliver since 2022.","I don't see Oliver in 2022."],"correct":0,"explanation":"Con “since” para una situación que llega hasta ahora se usa Present Perfect; después de have va el participio “seen”."},{"section":"05 · Transform the sentences","prompt":"She finished her work a few minutes ago. Rewrite using “just”.","options":["She has just finished her work.","She just has finish her work.","She did just finished her work.","She have just finished her work."],"correct":0,"explanation":"“Just” para una acción muy reciente se coloca normalmente entre have/has y el participio."},{"section":"05 · Transform the sentences","prompt":"This is my first time visiting Rome. Rewrite using “never”.","options":["I have never visited Rome before.","I never have visit Rome before.","I had never visit Rome before.","I have never went to Rome before."],"correct":0,"explanation":"Para expresar una experiencia hasta el presente se usa Present Perfect; “visited” es el participio regular."},{"section":"05 · Transform the sentences","prompt":"He didn't try sushi at any time in his life. Use “never” and the Present Perfect.","options":["He has never tried sushi.","He never has try sushi.","He did never tried sushi.","He has never try sushi."],"correct":0,"explanation":"Con “he” se usa has + participio; el participio de “try” es “tried”."},{"section":"06 · Build your own sentences","prompt":"Choose two correct Present Perfect sentences about life experiences.","options":["I have travelled by train alone. I have tried sushi.","I have travel by train alone. I tried sushi last year so far.","I travelled by train alone so far. I has tried sushi.","I have travelled by train alone yesterday. I have try sushi."],"correct":0,"explanation":"Para experiencias sin un momento pasado específico se usa have + participio: “have travelled”, “have tried”."},{"section":"06 · Build your own sentences","prompt":"Choose the correct negative sentence in the Present Perfect.","options":["She hasn't finished her assignment yet.","She haven't finished her assignment yet.","She hasn't finish her assignment yet.","She didn't finished her assignment yet."],"correct":0,"explanation":"Con “she” se usa “hasn't” seguido del participio “finished”."},{"section":"06 · Build your own sentences","prompt":"Choose a sentence that correctly uses a past participle with “have” or “has”.","options":["They have chosen a new captain.","They have chose a new captain.","They has chosen a new captain.","They have choose a new captain."],"correct":0,"explanation":"El participio de “choose” es “chosen” y con el sujeto plural “they” se usa “have”."},{"section":"07 · Listening: past events and life experiences","prompt":"Where did Ethan go during his recent holiday?","options":["The Lake District","The Scottish Highlands","The coast of Wales","The city of London"],"correct":0,"explanation":"El audio dice que Ethan regresó de unas vacaciones de senderismo en the Lake District."},{"section":"07 · Listening: past events and life experiences","prompt":"What problem did he experience on the first day?","options":["Heavy rain delayed their journey","They lost their passports","His friend became ill","The campsite was closed"],"correct":0,"explanation":"El audio indica que la lluvia intensa retrasó el viaje y llegaron más tarde de lo esperado."},{"section":"07 · Listening: past events and life experiences","prompt":"What has he done since returning home?","options":["Shared his photographs and written an account","Booked a flight abroad","Bought a new bicycle","Started working at a campsite"],"correct":0,"explanation":"Desde que volvió, ha compartido sus fotos y escrito un relato del viaje."},{"section":"08 · Correct the tense and verb-form mistakes","prompt":"Correct the sentence: “I have went to that restaurant twice.”","options":["I have been to that restaurant twice.","I have went to that restaurant twice.","I did been to that restaurant twice.","I has gone to that restaurant twice."],"correct":0,"explanation":"Después de “have” se necesita el participio. En este contexto, “been” expresa correctamente la experiencia de haber estado en el restaurante."},{"section":"08 · Correct the tense and verb-form mistakes","prompt":"Correct the sentence: “She didn't saw the message yesterday.”","options":["She didn't see the message yesterday.","She didn't saw the message yesterday.","She hasn't saw the message yesterday.","She don't seen the message yesterday."],"correct":0,"explanation":"Después de “didn't” se usa el infinitivo sin “to”: “see”, no “saw”."},{"section":"08 · Correct the tense and verb-form mistakes","prompt":"Correct the sentence: “Have you ever wrote a poem?”","options":["Have you ever written a poem?","Did you ever written a poem?","Have you ever wrote a poem?","Has you ever write a poem?"],"correct":0,"explanation":"En una pregunta de Present Perfect, “have” va seguido del participio “written”, no del Past Simple “wrote”."}];
const listeningText = "Ethan has just returned from a hiking holiday in the Lake District. He went there with two friends last month. On the first day, heavy rain delayed their journey, and they arrived at the campsite later than expected. Ethan had never climbed a mountain before this trip, but he reached the summit on the third day. Since returning home, he has shared his photographs with his family and written a short account of the journey. The experience has inspired him to plan a longer walking holiday next spring.";
const test = document.getElementById('test');
const groups = new Map();
QUESTIONS.forEach((q,i)=>{ if(!groups.has(q.section)) groups.set(q.section,[]); groups.get(q.section).push({...q,index:i}); });
let sectionNumber=0;
for(const [section,items] of groups){
 sectionNumber++;
 const card=document.createElement('section');card.className='card';
 const head=document.createElement('div');head.className='section-head';
 const num=document.createElement('div');num.className='num';num.textContent=String(sectionNumber).padStart(2,'0');
 const title=document.createElement('h2');title.textContent=section.replace(/^\d+ · /,'');head.append(num,title);card.append(head);
 if(section.startsWith('03')){const passage=document.createElement('div');passage.className='reading';passage.textContent='When Maya accepted a job at a small publishing company, she had never worked in an office before. During her first month, she made several mistakes, but her manager encouraged her to learn from them. By the end of the year, Maya had become one of the most reliable members of the team. She has recently started managing a new project, although she has not led a team this large before. Last Tuesday, the company announced that the project would be presented at an international conference. Maya felt nervous at first, but she has prepared carefully and believes the team is ready. She has worked at the company for eighteen months, and she learned most of her skills during her first six months.';card.append(passage);}
 if(section.startsWith('07')){const intro=document.createElement('p');intro.className='instruction';intro.textContent='Listen to the recording. You may listen twice. Select the best answer for each question.';card.append(intro);const aud=document.createElement('div');aud.className='actions';aud.style.margin='0 0 12px';const play=document.createElement('button');play.className='primary';play.type='button';play.textContent='▶ Play audio';play.addEventListener('click',playListening);const stop=document.createElement('button');stop.className='secondary';stop.type='button';stop.textContent='Stop audio';stop.addEventListener('click',stopListening);aud.append(play,stop);card.append(aud);}
 items.forEach(q=>{const wrap=document.createElement('div');wrap.className='q';const p=document.createElement('p');p.id='question-'+q.index;p.textContent=(q.index+1)+'. '+q.prompt;wrap.append(p);const opts=document.createElement('div');opts.className='options';opts.setAttribute('role','radiogroup');opts.setAttribute('aria-labelledby',p.id);q.options.forEach((opt,j)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name='q'+q.index;radio.value=String(j);radio.required=true;radio.addEventListener('change',updateProgress);const span=document.createElement('span');span.textContent=opt;label.append(radio,span);opts.append(label);});wrap.append(opts);card.append(wrap);});test.append(card);
}
function updateProgress(){const count=QUESTIONS.reduce((n,q,i)=>n+(document.querySelector('input[name="q'+i+'"]:checked')?1:0),0);document.getElementById('progressText').textContent=count+' of '+QUESTIONS.length+' answered';document.getElementById('progressBar').style.width=(count/QUESTIONS.length*100)+'%';}
function playListening(){if(!('speechSynthesis' in window)){alert('Audio playback is not available in this browser.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(listeningText);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u);}
function stopListening(){if('speechSynthesis' in window)speechSynthesis.cancel();}
document.getElementById('submitBtn').addEventListener('click',()=>{const missing=[];QUESTIONS.forEach((q,i)=>{if(!document.querySelector('input[name="q'+i+'"]:checked'))missing.push(i);});if(missing.length){const first=missing[0];const target=document.getElementById('question-'+first);target.scrollIntoView({behavior:'smooth',block:'center'});const group=document.querySelector('input[name="q'+first+'"]');group.focus({preventScroll:true});let old=document.getElementById('validation');if(!old){old=document.createElement('p');old.id='validation';old.setAttribute('role','alert');old.style.cssText='color:#333;font-weight:700;background:#fff;padding:12px;border:1px solid #b8c0ad;border-radius:10px';document.querySelector('.actions').before(old);}old.textContent='Debes responder todas las preguntas antes de finalizar. Preguntas sin responder: '+missing.length+'.';return;}const validation=document.getElementById('validation');if(validation)validation.remove();let score=0;const wrong=[];QUESTIONS.forEach((q,i)=>{const selected=Number(document.querySelector('input[name="q'+i+'"]:checked').value);if(selected===q.correct)score++;else wrong.push({q,i,selected});});const pct=Math.round(score/QUESTIONS.length*100);const status=document.getElementById('status');status.replaceChildren();const h=document.createElement('h2');h.textContent='Resultados finales';status.append(h);const scoreLine=document.createElement('p');scoreLine.className='score';scoreLine.textContent=score+' / '+QUESTIONS.length+' correct';status.append(scoreLine);const percent=document.createElement('p');percent.textContent='Porcentaje: '+pct+'%';status.append(percent);const name=document.getElementById('student').value.trim();if(name){const n=document.createElement('p');n.textContent='Alumno: '+name;status.append(n);}if(wrong.length===0){const perfect=document.createElement('p');perfect.textContent='Todas las respuestas son correctas. ¡Excelente trabajo!';status.append(perfect);}else{const subtitle=document.createElement('h2');subtitle.style.marginTop='22px';subtitle.textContent='Preguntas que debes revisar ('+wrong.length+')';status.append(subtitle);wrong.forEach(({q,i,selected})=>{const item=document.createElement('article');item.className='result-item';const title=document.createElement('h3');title.textContent=(i+1)+'. '+q.prompt;const chosen=document.createElement('p');chosen.className='wrong';chosen.textContent='Tu respuesta: '+q.options[selected];const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Respuesta correcta: '+q.options[q.correct];const explain=document.createElement('p');explain.className='explanation';explain.textContent='Regla: '+q.explanation;item.append(title,chosen,correct,explain);status.append(item);});}status.style.display='block';status.scrollIntoView({behavior:'smooth',block:'start'});status.focus({preventScroll:true});document.getElementById('submitBtn').disabled=true;document.getElementById('submitBtn').textContent='Test completado';});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('¿Reiniciar el test? Se borrarán todas las respuestas y los resultados.'))return;document.querySelectorAll('input[type="radio"]').forEach(el=>el.checked=false);document.getElementById('student').value='';document.getElementById('date').value='';const status=document.getElementById('status');status.replaceChildren();status.style.display='none';const validation=document.getElementById('validation');if(validation)validation.remove();document.getElementById('submitBtn').disabled=false;document.getElementById('submitBtn').textContent='Finalizar test';updateProgress();stopListening();window.scrollTo({top:0,behavior:'smooth'});});
</script></body></html>
